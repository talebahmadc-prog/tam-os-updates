<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAM OS Store — Admin</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<!-- Login -->
<div id="login" class="login-wrap">
  <div class="card">
    <div class="hd">TAM OS Store — Sign in</div>
    <div class="bd">
      <div id="loginErr" class="notice err hidden"></div>
      <label class="field"><span>Username</span><input id="u" autocomplete="username" /></label>
      <label class="field"><span>Password</span><input id="p" type="password" autocomplete="current-password" /></label>
      <button class="primary" id="loginBtn" style="width:100%">Sign in</button>
      <p class="muted" style="font-size:12px;margin-top:10px;">Distributors: sign in with your Neta licensing username &amp; password.</p>
    </div>
  </div>
</div>

<!-- App shell -->
<div id="app" class="hidden">
  <header>
    <h1>TAM OS Store</h1>
    <span class="muted" id="repoLine"></span>
    <div class="spacer"></div>
    <span id="whoami" class="muted"></span>
    <button id="logoutBtn">Sign out</button>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="upload" aria-selected="true">Upload APK</button>
    <button role="tab" data-tab="apps" aria-selected="false">Apps</button>
    <button role="tab" data-tab="vehicles" aria-selected="false">Vehicles</button>
    <button role="tab" data-tab="users" aria-selected="false" class="admin-only">Users</button>
    <button role="tab" data-tab="audit" aria-selected="false" class="admin-only">Audit</button>
  </div>

  <main>
    <div id="msg"></div>

    <!-- UPLOAD -->
    <section data-pane="upload">
      <div class="card"><div class="hd">Upload an app</div><div class="bd">
        <label class="dropzone" id="up-drop" for="up-file">
          <input id="up-file" type="file" accept=".apk,application/vnd.android.package-archive" hidden />
          <div class="dz-icon">⬆</div>
          <div class="dz-main">Choose an APK file</div>
          <div class="dz-sub muted">Package name and version fill in automatically</div>
        </label>
        <div id="up-detected" class="detected hidden"></div>

        <label class="field" id="up-name-wrap" style="margin-top:14px;"><span>App name</span>
          <input id="up-name" placeholder="fills in from the APK" /></label>

        <fieldset class="scope">
          <legend>Opens on</legend>
          <label class="row"><input type="radio" name="up-scope" id="up-all" checked /> All TAM OS vehicles</label>
          <label class="row"><input type="radio" name="up-scope" id="up-spec" /> Specific vehicles</label>
          <div class="checks" id="up-vehchecks"></div>
        </fieldset>

        <details id="up-adv">
          <summary>Advanced (optional)</summary>
          <div class="grid2" style="margin-top:12px;">
            <label class="field"><span>App id</span><input id="up-newid" placeholder="auto from package" /></label>
            <label class="field"><span>Package name</span><input id="up-pkg" placeholder="auto from APK" /></label>
            <label class="field"><span>Category</span><select id="up-cat"></select></label>
            <label class="field"><span>Variant</span><input id="up-variant" value="universal" /></label>
            <label class="field"><span>Version name</span><input id="up-vname" placeholder="auto" /></label>
            <label class="field"><span>Version code</span><input id="up-vcode" type="number" min="1" placeholder="auto" /></label>
            <label class="field"><span>Release tag</span><input id="up-tag" placeholder="auto" /></label>
            <label class="field"><span>Min Android version</span><input id="up-minos" type="number" min="1" placeholder="optional" /></label>
          </div>
          <label class="field"><span>Changelog</span><input id="up-changelog" placeholder="What changed" /></label>
        </details>

        <div class="row" style="margin-top:14px;">
          <button class="primary" id="up-submit" disabled>Upload</button>
          <small class="hint" id="up-hint">Pick an APK to begin.</small>
        </div>
        <div id="up-result" style="margin-top:10px;"></div>
      </div></div>
    </section>

    <!-- APPS -->
    <section data-pane="apps" class="hidden">
      <div class="card"><div class="hd">Apps — compatibility (all vehicles or specific)</div><div class="bd">
        <div id="apps-list"></div>
      </div></div>
      <div class="card" id="app-editor-card" class="hidden"><div class="hd" id="app-editor-title">Edit app</div>
        <div class="bd" id="app-editor"></div></div>
    </section>

    <!-- VEHICLES -->
    <section data-pane="vehicles" class="hidden">
      <div class="card"><div class="hd">Add / edit a vehicle</div><div class="bd">
        <div class="grid2">
          <label class="field"><span>Id (kebab-case)</span><input id="v-id" placeholder="neta-u" /></label>
          <label class="field"><span>Name</span><input id="v-name" placeholder="NETA U" /></label>
          <label class="field"><span>Brand</span><input id="v-brand" placeholder="NETA" /></label>
          <label class="field"><span>Model</span><input id="v-model" placeholder="U / U-II" /></label>
          <label class="field"><span>Android version</span><input id="v-os" type="number" min="1" placeholder="10" /></label>
          <label class="field"><span>Chipset</span><input id="v-chip" placeholder="sa8155" /></label>
          <label class="field"><span>Tags (comma)</span><input id="v-tags" placeholder="neta-u, qualcomm, tam-os" /></label>
        </div>
        <button class="primary" id="v-save">Save vehicle</button>
      </div></div>
      <div class="card"><div class="hd">Vehicles</div><div class="bd"><div id="veh-list"></div></div></div>
    </section>

    <!-- USERS -->
    <section data-pane="users" class="hidden">
      <div class="card"><div class="hd">Create user</div><div class="bd">
        <div class="grid2">
          <label class="field"><span>Username</span><input id="nu-name" /></label>
          <label class="field"><span>Password (min 8)</span><input id="nu-pass" type="password" /></label>
          <label class="field"><span>Role</span><select id="nu-role"><option value="uploader">uploader</option><option value="admin">admin</option></select></label>
        </div>
        <button class="primary" id="nu-create">Create user</button>
      </div></div>
      <div class="card"><div class="hd">Users</div><div class="bd"><div id="users-list"></div></div></div>
    </section>

    <!-- AUDIT -->
    <section data-pane="audit" class="hidden">
      <div class="card"><div class="hd">Audit log (latest 200)</div><div class="bd"><div id="audit-list"></div></div></div>
    </section>
  </main>
</div>

<script src="/apk.js"></script>
<script src="/app.js"></script>
</body>
</html>
