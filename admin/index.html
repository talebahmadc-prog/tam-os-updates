<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAM OS — App Compatibility Manager</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d9dde3; --text: #1b2430;
    --muted: #697586; --accent: #2f6fed; --accent-weak: #e7efff;
    --ok: #137a4b; --ok-weak: #e3f5ec; --no: #b23b3b; --no-weak: #fbe9e9;
    --radius: 10px; --shadow: 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --panel: #161c25; --border: #2a323d; --text: #e7ecf2;
      --muted: #94a0b0; --accent: #5a8dff; --accent-weak: #1b2740;
      --ok: #51d196; --ok-weak: #15291f; --no: #ff7a7a; --no-weak: #2a1717;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .repo { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button, select, input[type=number], input[type=text] {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.05); }
  .tabs { display: flex; gap: 6px; padding: 10px 20px 0; }
  .tabs button { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .tabs button[aria-selected=true] { background: var(--accent-weak); border-color: var(--accent); color: var(--text); }
  main { padding: 16px 20px 60px; max-width: 1200px; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
          box-shadow: var(--shadow); }
  .card .hd { padding: 11px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .card .bd { padding: 14px; }
  .app-list { max-height: 70vh; overflow: auto; }
  .app-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .app-item:hover { background: var(--accent-weak); }
  .app-item[aria-selected=true] { background: var(--accent-weak); border-left: 3px solid var(--accent); }
  .app-item .nm { font-weight: 600; }
  .app-item .mt { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px;
          border: 1px solid var(--border); color: var(--muted); }
  .pill.on { color: var(--ok); background: var(--ok-weak); border-color: transparent; }
  .pill.off { color: var(--no); background: var(--no-weak); border-color: transparent; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 14px; padding: 12px 14px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .grid-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 14px; }
  .result { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .vres { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
  .vres.yes { border-color: var(--ok); background: var(--ok-weak); }
  .vres.no { opacity: .65; }
  .vres .vn { font-weight: 600; }
  .vres .vd { font-size: 12px; color: var(--muted); }
  table.matrix { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 7px 9px; text-align: center; }
  table.matrix th.app, table.matrix td.app { text-align: left; white-space: nowrap; }
  .yes-cell { color: var(--ok); font-weight: 700; }
  .no-cell { color: var(--muted); }
  .muted { color: var(--muted); }
  .status { font-size: 12px; color: var(--muted); }
  .hidden { display: none; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  code { background: var(--accent-weak); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>TAM OS — App Compatibility Manager</h1>
    <div class="repo" id="repoLine">talebahmadc-prog/tam-os-updates</div>
  </div>
  <div class="spacer"></div>
  <select id="source" title="Data source">
    <option value="github">Load from GitHub (main)</option>
    <option value="local">Load from local files (./..)</option>
  </select>
  <label class="status">or upload apps.json: <input type="file" id="upload" accept="application/json" /></label>
  <button id="reload">Reload</button>
  <button class="primary" id="download">Download apps.json</button>
</header>

<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="editor">Editor</button>
  <button role="tab" aria-selected="false" data-tab="matrix">Compatibility matrix</button>
</div>

<main>
  <div id="tab-editor">
    <div class="layout">
      <section class="card">
        <div class="hd">Apps <span class="muted" id="appCount"></span></div>
        <div class="bd" style="padding:8px 10px;">
          <input type="text" id="search" placeholder="Search apps…" style="width:100%;margin-bottom:8px;" />
        </div>
        <div class="app-list" id="appList"></div>
      </section>

      <section class="card">
        <div class="hd" id="editorTitle">Select an app</div>
        <div class="bd" id="editorBody">
          <p class="muted">Pick an app from the list to edit which vehicles it opens on.</p>
        </div>
      </section>
    </div>
  </div>

  <div id="tab-matrix" class="hidden">
    <section class="card">
      <div class="hd">Apps × Vehicles</div>
      <div class="bd" style="overflow:auto;">
        <table class="matrix" id="matrix"></table>
        <p class="note">✓ = app is compatible and has a release for that vehicle. Disabled apps are hidden from vehicles.</p>
      </div>
    </section>
  </div>

  <p class="status" id="globalStatus"></p>
</main>

<script type="module">
// ---------- config ----------
const CONFIG = {
  owner: "talebahmadc-prog",
  repo: "tam-os-updates",
  branch: "main",
};
const RAW = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}`;
document.getElementById("repoLine").textContent = `${CONFIG.owner}/${CONFIG.repo}`;

// ---------- compatibility engine (mirror of tools/compat.mjs) ----------
function matchesCriteria(vehicle, criteria) {
  if (!criteria) return true;
  if (Array.isArray(criteria.chipset) && criteria.chipset.length) {
    const chip = vehicle.hardware?.chipset;
    if (!chip || !criteria.chipset.includes(chip)) return false;
  }
  if (typeof criteria.minAndroidVersion === "number") {
    if ((vehicle.androidVersion ?? 0) < criteria.minAndroidVersion) return false;
  }
  if (Array.isArray(criteria.tags) && criteria.tags.length) {
    const set = new Set(vehicle.tags || []);
    if (!criteria.tags.every(t => set.has(t))) return false;
  }
  return true;
}
function isExcluded(vehicle, exclude) {
  if (!exclude) return false;
  if (Array.isArray(exclude.vehicles) && exclude.vehicles.includes(vehicle.id)) return true;
  if (Array.isArray(exclude.tags) && exclude.tags.length) {
    const set = new Set(vehicle.tags || []);
    if (exclude.tags.some(t => set.has(t))) return true;
  }
  return false;
}
function isAppCompatible(app, vehicle) {
  if (!app.enabled) return false;
  const c = app.compatibility || {};
  const gate = c.allVehicles === true || (Array.isArray(c.vehicles) && c.vehicles.includes(vehicle.id));
  if (!gate) return false;
  if (!matchesCriteria(vehicle, c.require)) return false;
  if (isExcluded(vehicle, c.exclude)) return false;
  return true;
}
function pickRelease(app, vehicle) {
  const cands = (app.releases || []).filter(r => {
    const rc = r.compatibility || {};
    if (Array.isArray(rc.vehicles) && rc.vehicles.length && rc.vehicles.includes(vehicle.id)) return true;
    return matchesCriteria(vehicle, rc.require);
  });
  if (!cands.length) return null;
  const score = r => {
    const rc = r.compatibility || {};
    let s = 0;
    if (Array.isArray(rc.vehicles) && rc.vehicles.includes(vehicle.id)) s += 100;
    if (rc.require && Object.keys(rc.require).length) s += 10;
    return s * 1e6 + (r.versionCode || 0);
  };
  return cands.sort((a, b) => score(b) - score(a))[0];
}

// ---------- state ----------
let appsDoc = null, vehicles = [], categories = [], selectedId = null;
const $ = s => document.querySelector(s);
const el = (t, p = {}) => Object.assign(document.createElement(t), p);

async function fetchJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}

async function load() {
  const mode = $("#source").value;
  const base = mode === "github" ? RAW : "..";
  setStatus("Loading…");
  try {
    const [a, v, c] = await Promise.all([
      fetchJson(`${base}/data/apps.json`),
      fetchJson(`${base}/data/vehicles.json`),
      fetchJson(`${base}/data/categories.json`),
    ]);
    appsDoc = a; vehicles = v.vehicles || []; categories = c.categories || [];
    selectedId = null;
    renderList(); renderEditor(); renderMatrix();
    setStatus(`Loaded ${appsDoc.apps.length} apps, ${vehicles.length} vehicles from ${mode === "github" ? "GitHub" : "local files"}.`);
  } catch (e) {
    setStatus("⚠ " + e.message + "  — try 'Load from GitHub' or upload apps.json manually.");
  }
}

function setStatus(m) { $("#globalStatus").textContent = m; }

function renderList() {
  const q = ($("#search").value || "").toLowerCase();
  const list = $("#appList"); list.innerHTML = "";
  const apps = appsDoc.apps.filter(a =>
    !q || a.name.toLowerCase().includes(q) || a.id.includes(q) || (a.packageName||"").includes(q));
  $("#appCount").textContent = `(${apps.length})`;
  for (const app of apps) {
    const n = vehicles.filter(v => isAppCompatible(app, v) && pickRelease(app, v)).length;
    const item = el("div", { className: "app-item" });
    item.setAttribute("aria-selected", app.id === selectedId);
    item.innerHTML = `<div class="nm">${esc(app.name)}</div>
      <div class="mt">${esc(app.id)} · <span class="pill ${app.enabled?'on':'off'}">${app.enabled?'enabled':'disabled'}</span>
      · opens on ${n} vehicle${n===1?'':'s'}</div>`;
    item.onclick = () => { selectedId = app.id; renderList(); renderEditor(); };
    list.appendChild(item);
  }
}

function renderEditor() {
  const body = $("#editorBody"), title = $("#editorTitle");
  const app = appsDoc?.apps.find(a => a.id === selectedId);
  if (!app) { title.textContent = "Select an app"; body.innerHTML = '<p class="muted">Pick an app from the list.</p>'; return; }
  const c = app.compatibility ||= {};
  c.vehicles ||= []; c.require ||= {}; c.exclude ||= { vehicles: [], tags: [] };
  title.textContent = `${app.name} — ${app.id}`;

  const chipsets = [...new Set(vehicles.map(v => v.hardware?.chipset).filter(Boolean))];

  body.innerHTML = `
    <label class="row"><input type="checkbox" id="f-enabled" ${app.enabled?'checked':''}/> <b>App enabled</b> (uncheck to hide from all vehicles)</label>

    <fieldset>
      <legend>Opens on</legend>
      <label class="row"><input type="radio" name="scope" id="f-all" ${c.allVehicles?'checked':''}/> All vehicles</label>
      <label class="row"><input type="radio" name="scope" id="f-specific" ${!c.allVehicles?'checked':''}/> Specific vehicles only</label>
      <div id="vehBox" class="grid-checks" style="margin-top:8px;">
        ${vehicles.map(v => `<label class="row"><input type="checkbox" class="veh" value="${v.id}"
            ${c.vehicles.includes(v.id)?'checked':''}/> ${esc(v.name)} <span class="muted">(${v.id})</span></label>`).join("")}
      </div>
    </fieldset>

    <fieldset>
      <legend>Mandatory requirements (all must match)</legend>
      <div style="margin-bottom:8px;">Required chipset(s):
        <div class="grid-checks">${chipsets.map(ch => `<label class="row"><input type="checkbox" class="chip" value="${ch}"
          ${(c.require.chipset||[]).includes(ch)?'checked':''}/> ${ch}</label>`).join("") || '<span class="muted">none</span>'}</div>
      </div>
      <label class="row">Min Android version:
        <input type="number" id="f-minandroid" min="1" style="width:90px" value="${c.require.minAndroidVersion ?? ''}"/></label>
      <label class="row">Required tags (comma-separated):
        <input type="text" id="f-reqtags" style="flex:1" value="${(c.require.tags||[]).join(', ')}"/></label>
    </fieldset>

    <fieldset>
      <legend>Preview — which vehicles this app opens on</legend>
      <div class="result" id="preview"></div>
    </fieldset>
    <p class="note">Changes are applied to the in-memory copy. Click <b>Download apps.json</b> and commit the file to publish.</p>
  `;

  const apply = () => {
    app.enabled = $("#f-enabled").checked;
    c.allVehicles = $("#f-all").checked;
    c.vehicles = [...body.querySelectorAll(".veh:checked")].map(x => x.value);
    const chips = [...body.querySelectorAll(".chip:checked")].map(x => x.value);
    if (chips.length) c.require.chipset = chips; else delete c.require.chipset;
    const ma = parseInt($("#f-minandroid").value, 10);
    if (!isNaN(ma)) c.require.minAndroidVersion = ma; else delete c.require.minAndroidVersion;
    const tags = $("#f-reqtags").value.split(",").map(s => s.trim()).filter(Boolean);
    if (tags.length) c.require.tags = tags; else delete c.require.tags;
    $("#vehBox").style.opacity = c.allVehicles ? .45 : 1;
    renderPreview(app); renderList(); renderMatrix();
  };
  body.querySelectorAll("input").forEach(i => i.addEventListener("change", apply));
  body.querySelectorAll("#f-reqtags, #f-minandroid").forEach(i => i.addEventListener("input", apply));
  $("#vehBox").style.opacity = c.allVehicles ? .45 : 1;
  renderPreview(app);
}

function renderPreview(app) {
  const box = $("#preview"); box.innerHTML = "";
  for (const v of vehicles) {
    const ok = isAppCompatible(app, v);
    const rel = ok ? pickRelease(app, v) : null;
    const d = el("div", { className: "vres " + (ok && rel ? "yes" : "no") });
    let detail = ok ? (rel ? `v${rel.versionName} · ${rel.releaseTag}${rel.published?'':' · not published'}` : "compatible but no release") : "not compatible";
    d.innerHTML = `<div class="vn">${ok && rel ? "✓" : "–"} ${esc(v.name)}</div><div class="vd">${detail}</div>`;
    box.appendChild(d);
  }
}

function renderMatrix() {
  if (!appsDoc) return;
  const t = $("#matrix"); t.innerHTML = "";
  const head = el("tr");
  head.appendChild(el("th", { className: "app", textContent: "App" }));
  for (const v of vehicles) head.appendChild(el("th", { innerHTML: `${esc(v.name)}<br><span class="muted">${v.id}</span>` }));
  t.appendChild(head);
  for (const app of appsDoc.apps) {
    const tr = el("tr");
    const name = el("td", { className: "app" });
    name.innerHTML = `${esc(app.name)} <span class="muted">${app.enabled?'':'(disabled)'}</span>`;
    tr.appendChild(name);
    for (const v of vehicles) {
      const ok = isAppCompatible(app, v) && pickRelease(app, v);
      const td = el("td", { className: ok ? "yes-cell" : "no-cell", textContent: ok ? "✓" : "·" });
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
}

function download() {
  if (!appsDoc) return;
  appsDoc.updatedAt = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify(appsDoc, null, 2) + "\n"], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "apps.json" });
  document.body.appendChild(a); a.click(); a.remove();
}

function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[m])); }

// ---------- wiring ----------
$("#reload").onclick = load;
$("#source").onchange = load;
$("#download").onclick = download;
$("#search").oninput = renderList;
$("#upload").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    appsDoc = JSON.parse(await file.text());
    if (!vehicles.length) { try { const v = await fetchJson(`${RAW}/data/vehicles.json`); vehicles = v.vehicles; } catch {} }
    selectedId = null; renderList(); renderEditor(); renderMatrix();
    setStatus(`Loaded ${appsDoc.apps.length} apps from uploaded file.`);
  } catch (err) { setStatus("⚠ Invalid JSON file: " + err.message); }
};
document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[role=tab]').forEach(x => x.setAttribute("aria-selected", x === b));
  $("#tab-editor").classList.toggle("hidden", b.dataset.tab !== "editor");
  $("#tab-matrix").classList.toggle("hidden", b.dataset.tab !== "matrix");
});

load();
</script>
</body>
</html>
